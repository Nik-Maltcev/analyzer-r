{% extends "base.html" %}
{% block signals_content %}
<div class="signals-page">
    <div class="calc-settings-bar" id="calc-settings-bar">
        {% include "components/calc_settings.html" %}
    </div>

    <div class="market-selector">
        {% include "components/market_selector.html" %}
    </div>

    <div class="signals-mode-bar">
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="all" type="button"
                    onclick="selectSignalsWorkspace(this)">
                <i data-lucide="list-filter"></i><span>Все сигналы</span>
            </button>
            <button class="mode-btn" data-scanner="corrbreak" type="button"
                    onclick="selectSignalsWorkspace(this)">
                <i data-lucide="unlink"></i><span>Corr Breakdown</span>
            </button>
            <button class="mode-btn" data-scanner="momentum" type="button"
                    onclick="selectSignalsWorkspace(this)">
                <i data-lucide="trending-up"></i><span>Momentum</span>
            </button>
            <button class="mode-btn" data-scanner="drawdown" type="button"
                    onclick="selectSignalsWorkspace(this)">
                <i data-lucide="chart-no-axes-column-decreasing"></i><span>Drawdown</span>
            </button>
        </div>
        <div class="mode-filters" id="mode-filters">
            {% include "components/signal_filters.html" %}
        </div>
    </div>

    <!-- Signals content: loads immediately via HTMX from server -->
    <div id="signals-content" class="signals-content"
         hx-get="/tab/signals"
         hx-vals='{"mode":"all","market":"{{ market|default("crypto") }}"}'
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Загрузка сигналов...</p>
        </div>
    </div>
</div>
{% endblock %}
